name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Lint shell scripts
        run: |
          shellcheck --version
          git ls-files -z '*.sh' '*.bats' '*.bash' | xargs -0 shellcheck -x
